# Actualiza productos.js automáticamente cuando subes un catalogo.xlsx nuevo
# (o cuando agregas/quitas fotos en la carpeta fotos/).
name: Actualizar catalogo

on:
  push:
    branches: [main]
    paths:
      - "catalogo.xlsx"
      - "fotos/**"
      - "herramientas/**"
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write      # necesario para guardar productos.js en el repositorio
  pages: write         # necesario para pedir la publicación de la página

concurrency:
  group: actualizar-catalogo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar openpyxl
        run: pip install openpyxl

      - name: Generar productos.js desde catalogo.xlsx
        run: python herramientas/actualizar_catalogo.py

      - name: Guardar los cambios
        id: guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productos.js reporte_actualizacion.txt
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            echo "cambio=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Catalogo actualizado automaticamente"
            git pull --rebase origin main
            git push
            echo "cambio=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Pedir a GitHub Pages que publique
        if: steps.guardar.outputs.cambio == 'si'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
